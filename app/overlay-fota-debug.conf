# Debug logging for the FOTA and Memfault OTA path.
# Usage: west build ... -- -DEXTRA_CONF_FILE=overlay-fota-debug.conf

# Memfault SDK (module "mflt", includes the OTA query and override backend)
CONFIG_MEMFAULT_LOG_LEVEL_DBG=y

# nRF Cloud job handling, download and CoAP transport
CONFIG_NRF_CLOUD_FOTA_POLL_LOG_LEVEL_DBG=y
CONFIG_NRF_CLOUD_LOG_LEVEL_DBG=y
CONFIG_NRF_CLOUD_COAP_LOG_LEVEL_DBG=y

# Download and DFU target (image type detection, slot handling)
CONFIG_FOTA_DOWNLOAD_LOG_LEVEL_DBG=y
CONFIG_DFU_TARGET_LOG_LEVEL_DBG=y
CONFIG_DOWNLOADER_LOG_LEVEL_DBG=y

# Log buffering: debug output from the download path is bursty
CONFIG_LOG_BUFFER_SIZE=8192
