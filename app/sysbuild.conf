# Sysbuild configuration for Myriota HyperPulse builds

# Merge application hex with HyperPulse network info for development
SB_CONFIG_HYPERPULSE_MERGE_APP_AND_NETWORK_INFO=y

# MCUboot is not needed for this NTN bring-up image and conflicts with the
# HyperPulse static partition layout when combined with TFM.
SB_CONFIG_BOOTLOADER_MCUBOOT=n
