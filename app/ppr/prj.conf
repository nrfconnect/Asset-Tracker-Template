# Logs are forwarded to the application core over IPC (icmsg-me).
CONFIG_LOG=y
CONFIG_LOG_BACKEND_IPC_SERVICE=y
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_OPENAMP=n
CONFIG_PM=n

# Name reported to the application core, used as the "cpuppr/" log line prefix.
CONFIG_LOG_DOMAIN_NAME="cpuppr"

# Must run after the icmsg workqueue is started (CONFIG_KERNEL_INIT_PRIORITY_DEFAULT).
# The backend enables the mbox RX callback at init, and an interrupt before the
# workqueue exists trips an assert in icmsg.c.
CONFIG_LOG_CORE_INIT_PRIORITY=47

# Keep RAM use low, the PPR runs from its 64 KB TCM (CONFIG_XIP=n).
#
# Deferred log mode (the default) is required: the IPC backend only becomes ready
# after an asynchronous handshake with the application core, and only the log
# processing thread retries activating it.
CONFIG_LOG_BUFFER_SIZE=256
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=640
CONFIG_HEAP_MEM_POOL_SIZE=256

# Output goes over IPC only. No UART console on the PPR.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
