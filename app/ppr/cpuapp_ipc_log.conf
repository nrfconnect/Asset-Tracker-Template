# Application core side of the PPR log forwarding. Added to the application image
# by app/sysbuild.cmake when SB_CONFIG_LAUNCH_PPR is enabled.

CONFIG_LOG=y
CONFIG_LOG_MULTIDOMAIN=y
CONFIG_LOG_LINK_IPC_SERVICE=y
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# Prefix each log line with the core it came from ("cpuapp/" or "cpuppr/").
# The PPR core's name is fetched over the same IPC link.
CONFIG_LOG_DOMAIN_NAME_PREFIX=y
CONFIG_LOG_DOMAIN_NAME="cpuapp"

# The log link init must run after both the VPR launcher that starts the PPR core
# (CONFIG_NORDIC_VPR_LAUNCHER_INIT_PRIORITY, default 0) and the icmsg-me backend
# init (CONFIG_IPC_SERVICE_REG_BACKEND_PRIORITY, default 46). Otherwise the link
# waits forever for a core that was never launched, or races the backend init.
CONFIG_LOG_CORE_INIT_PRIORITY=47
