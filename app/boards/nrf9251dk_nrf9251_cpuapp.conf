# Settings are stored in MRAM, which ZMS supports and FCB does not.
CONFIG_SETTINGS_FCB=n
CONFIG_FCB=n
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# No NSIB (b0), so there is no bootloader version to report.
CONFIG_NRF_CLOUD_SEND_DEVICE_INFO_BOOTLOADER_VERSION=n

# slot0 is write protected by MPCCONF, so the image trailer cannot be updated to
# confirm an update. Boot requests move that signal to boot_request_partition.
CONFIG_CRC=y
CONFIG_NRF_MCUBOOT_BOOT_REQUEST=y

# Memfault coredumps are stored in MRAM (memfault_coredump_partition in the board
# overlay).
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=n
CONFIG_MEMFAULT_COREDUMP_STORAGE_NRF_MRAM=y

