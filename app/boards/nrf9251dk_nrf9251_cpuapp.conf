# Settings are stored in MRAM, which ZMS supports and FCB does not.
CONFIG_SETTINGS_FCB=n
CONFIG_FCB=n
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# External flash
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Full modem FOTA
CONFIG_NRF_CLOUD_FOTA_FULL_MODEM_UPDATE=y
CONFIG_STREAM_FLASH_ERASE=y

# No NSIB (b0), so there is no bootloader version to report.
CONFIG_NRF_CLOUD_SEND_DEVICE_INFO_BOOTLOADER_VERSION=n

# slot0 is write protected by MPCCONF, so the image trailer cannot be updated to
# confirm an update. Boot requests move that signal to boot_request_partition.
CONFIG_CRC=y
CONFIG_NRF_MCUBOOT_BOOT_REQUEST=y

# Memfault coredumps are stored in MRAM (memfault_coredump_partition in the board
# overlay).
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=n
CONFIG_MEMFAULT_COREDUMP_STORAGE_NRF_MRAM=y

# Wi-Fi location using the built-in nRF92 Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_NRF92=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_DUMMY=y
CONFIG_NET_OFFLOAD=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=50

# Configure location priority order and timeouts
CONFIG_LOCATION_METHOD_WIFI=y
CONFIG_LOCATION_WORKQUEUE_STACK_SIZE=8192
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_FIRST_GNSS=y
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_SECOND_WIFI=y
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_THIRD_CELLULAR=y
CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT=10
# The nRF92 Wi-Fi driver has no scan abort: when the request times out, the modem
# keeps scanning in the background and the late result is dropped.
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_TIMEOUT=10000
# APs send a beacon every 102.4 ms, delayed by up to ~30 ms on a busy channel. 260 ms
# per channel gives each AP two chances to be heard.
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_DWELL_TIME_PASSIVE=260
# Most 2.4 GHz APs use the non-overlapping channels 1, 6 and 11. Scanning only these
# reduces scan time and power consumption.
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_CHANNELS="2:1,6,11"
CONFIG_WIFI_NRF92_INCREASE_MAX_GAIN=y

# Wi-Fi scan heap allocations should be changed when
# CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT is changed.
CONFIG_HEAP_MEM_POOL_SIZE=40000
