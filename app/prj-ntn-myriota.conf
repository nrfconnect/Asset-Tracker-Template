# Minimal project configuration for the Myriota HyperPulse NTN backend.
# Use instead of prj.conf to keep the image within the HyperPulse flash layout.

CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="ATT NTN Myriota"
CONFIG_RESET_ON_FATAL_ERROR=y

# NCS_SAMPLES_DEFAULTS enables ASSERT/SPIN_VALIDATE, which trips a recursive
# spinlock in the HyperPulse precompiled library's ntn_scheduler thread.
CONFIG_ASSERT=n
CONFIG_SPIN_VALIDATE=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_DEFAULT_LEVEL=3

# DK buttons
CONFIG_DK_LIBRARY=y
CONFIG_GPIO=y

# Shell
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL=y
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2048
CONFIG_AT_SHELL=y

# Heap and stacks
CONFIG_MAIN_STACK_SIZE=2560
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# NTN application
CONFIG_APP_NTN_MODE=y
CONFIG_APP_NTN_LOG_LEVEL_DBG=y
CONFIG_APP_NTN_TIMER_TIMEOUT_MINUTES=15

# Modem
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=8192
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=8192
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=n
CONFIG_DATE_TIME_THREAD_STACK_SIZE=1024

# HyperPulse networking (socket offload)
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_NET_NATIVE=n
CONFIG_NET_IPV6=n

# HyperPulse AT interface
CONFIG_AT_CMD_CUSTOM=y
CONFIG_AT_CMD_CUSTOM_LOG_LEVEL_OFF=y
CONFIG_AT_PARSER=y
CONFIG_MODEM_KEY_MGMT=y

# Zbus + state machine
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y

# Task watchdog
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=4
CONFIG_TASK_WDT_MIN_TIMEOUT=10000

# Float formatting for uplink payload
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_FPU=n
CONFIG_STATIC_INIT_GNU=y

# Keep TFM quiet
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=n
CONFIG_TFM_SPM_LOG_LEVEL_SILENCE=y

# GNSS antenna on nRF9151 DK
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_EXTERNAL=y

# No MCUboot for Myriota NTN bring-up (see sysbuild.conf)
CONFIG_BOOTLOADER_MCUBOOT=n

# Disable board defaults not needed here
CONFIG_SPI=n
CONFIG_SPI_NOR=n
CONFIG_PWM=n
