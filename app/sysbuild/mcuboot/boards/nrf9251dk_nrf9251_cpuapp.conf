# Serial recovery runs on uart132 (VCOM1) while the console and MCUboot log stay
# on uart133 (VCOM0). The shared prj.conf disables the console because the nRF91
# boards share one UART between the two.
# Entered by holding button1 at reset (mcuboot-button0 alias in the overlay).
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_FPROTECT=n
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# With the slot write protected, the application cannot update the image trailer
# to confirm an update. Boot requests move that signal to boot_request_partition,
# which sits outside the protected region.
CONFIG_CRC=y
CONFIG_NRF_MCUBOOT_BOOT_REQUEST=y
