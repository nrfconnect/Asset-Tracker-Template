name: Target tests

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        required: true
      artifact_fw_version:
        type: string
        required: true
      run_nightly_tests:
        type: boolean
        required: false
        default: false
      pytest_path:
        type: string
        required: false
        default: tests/test_functional
      devices:
        description: Space separated list of devices. e.g. thingy91x nrf9151dk
        type: string
        required: true
        default: thingy91x
      pytest_args:
        description: Extra arguments appended verbatim to the pytest invocation.
                     (e.g. "-k test_app_fota_release_to_nightly"). Leave empty for the default behaviour.
        type: string
        required: false
        default: ""

  workflow_dispatch:
    inputs:
      artifact_fw_version:
        description: The firmware version found under this run_id
        type: string
        required: true
      artifact_run_id:
        description: The run ID of the workflow to fetch artifacts from
        type: string
        required: true
      run_nightly_tests:
        description: Include slow tests for the selected boards
        type: boolean
        required: false
        default: false
      pytest_path:
        description: Select test execution path
        type: string
        required: false
        default: tests
      devices:
        description: Space separated list of devices. e.g. thingy91x nrf9151dk
        type: string
        required: true
        default: thingy91x
      pytest_args:
        description: Extra arguments appended verbatim to the pytest invocation.
                     (e.g. "-k test_app_fota_release_to_nightly"). Leave empty for the default behaviour.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    # Collect the tests with pytest (no hardware needed) and plan one job per test function.
    # A collection error fails here, before any hardware runner is used.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nrfconnect/asset-tracker-template:test-docker-v1.0.2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: asset-tracker-template

      - name: Install dependencies
        working-directory: asset-tracker-template/tests/on_target
        run: pip install -r requirements.txt --break-system-packages

      - name: Plan target tests
        id: plan
        working-directory: asset-tracker-template/tests/on_target
        env:
          DEVICES: ${{ inputs.devices }}
          NIGHTLY: ${{ inputs.run_nightly_tests }}
          PYTEST_PATH: ${{ inputs.pytest_path }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          python3 scripts/ci_test_matrix.py \
            --devices "$DEVICES" \
            --nightly "$NIGHTLY" \
            --pytest-path "$PYTEST_PATH" \
            --pytest-args "$PYTEST_ARGS"

  target_test:
    needs: plan
    if: needs.plan.outputs.count != '0'
    # One job per device and test function. Jobs for the same device queue on its runner.
    strategy:
      fail-fast: false # Don't fail all jobs if one fails
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    # Self-hosted runner is labeled according to the device it is linked with
    runs-on: cia-trd-${{ matrix.device }}
    environment: ${{ matrix.device }}
    name: ${{ matrix.name }}
    permissions:
      actions: read
      contents: write
      packages: read
    container:
      image: ghcr.io/nrfconnect/asset-tracker-template:test-docker-v1.0.2
      options: --privileged
      volumes:
        - /dev:/dev:rw
        - /run/udev:/run/udev

    env:
      DUT_DEVICE_TYPE: ${{ vars.DUT_DEVICE_TYPE }}
      LOG_FILENAME: att_test_log
      PYTHONUNBUFFERED: "1"
      TEST_REPORT_NAME: ATT Firmware Test Report
      MEMFAULT_ORGANIZATION_TOKEN: ${{ secrets.MEMFAULT_ORGANIZATION_TOKEN }}
      MEMFAULT_ORGANIZATION_SLUG: ${{ vars.MEMFAULT_ORGANIZATION_SLUG }}
      MEMFAULT_PROJECT_SLUG: ${{ vars.MEMFAULT_PROJECT_SLUG }}
      # The FOTA tests create Memfault releases and deploy them to this cohort of the DUT
      MEMFAULT_TEST_COHORT: ${{ vars.MEMFAULT_TEST_COHORT }}
      # Used to resolve and download the most recent release, which the app
      # FOTA test flashes before updating to the build under test.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # pytest node ID planned by scripts/ci_test_matrix.py
      TEST_ID: ${{ matrix.test }}
    steps:
      - name: Display Runner Serial Number
        # The serial number is set by a pre-job script in .env file on the local actions-runner directory
        run: |
          echo "Inside Container - Runner Serial Number: $RUNNER_SERIAL_NUMBER"
          echo "Inside Container - Runner Serial Number: ${{ env.RUNNER_SERIAL_NUMBER }}"

      - name: Export runner environment for the test steps
        # ``env.*`` is only available at step level, not in the job's ``env``.
        run: |
          {
            echo "SEGGER=${{ env.RUNNER_SERIAL_NUMBER }}"
            echo "UUID=${{ env.UUID }}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: asset-tracker-template

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: firmware-artifacts-att
          path: asset-tracker-template/tests/on_target/artifacts
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact path
        working-directory: asset-tracker-template
        run: |
          ls -l tests/on_target/artifacts

      - name: Install dependencies
        working-directory: asset-tracker-template/tests/on_target
        run: |
          pip install -r requirements.txt --break-system-packages
          nrfutil install trace

      - name: Upload symbol file to Memfault (nightly CI account)
        # Only in the job of the test that uses the debug (Memfault) firmware
        if: ${{ matrix.device == 'thingy91x' && inputs.run_nightly_tests && contains(matrix.test, 'test_memfault.py') }}
        working-directory: asset-tracker-template/tests/on_target/artifacts
        run: |
          memfault \
              --org-token ${{ secrets.MEMFAULT_ORGANIZATION_TOKEN }} \
              --org ${{ vars.MEMFAULT_ORGANIZATION_SLUG }} \
              --project ${{ vars.MEMFAULT_PROJECT_SLUG }} \
              upload-mcu-symbols \
              --check-uploaded \
              asset-tracker-template-${{ inputs.artifact_fw_version }}-debug-${{ vars.DUT_DEVICE_TYPE }}-nrf91.elf

      - name: Program modem firmware
        if: contains(fromJSON('["thingy91x", "nrf9151dk", "gnss_nrf9151dk", "prov_thingy91x"]'), matrix.device)
        working-directory: asset-tracker-template/tests/on_target
        run: |
          nrfutil device program \
            --serial-number ${{ env.RUNNER_SERIAL_NUMBER }} \
            --firmware artifacts/mfw_nrf91x1_2.0.4.zip

      - name: Target test
        working-directory: asset-tracker-template/tests/on_target
        shell: bash
        run: |
          mkdir -p results
          pytest -v \
            --junit-xml=results/test-results.xml \
            --html=results/test-results.html --self-contained-html \
            "$TEST_ID"

      - name: Show end of test log on failure
        if: failure()
        working-directory: asset-tracker-template/tests/on_target
        shell: bash
        run: |
          for log in outcomes/logs/*.txt; do
            echo "::group::tail -n 200 $log"
            if [[ -s "$log" ]]; then
              tail -n 200 "$log"
            else
              echo "(empty or not captured)"
            fi
            echo "::endgroup::"
          done

      - name: Generate and Push Power Badge
        if: ${{ always() && matrix.device == 'ppk_thingy91x' }}
        working-directory: asset-tracker-template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tests/on_target/scripts/update_power_badge.sh

      - name: Results
        if: always()
        uses: pmeier/pytest-results-action@v0.9.0
        with:
          path: asset-tracker-template/tests/on_target/results/*.xml
          summary: true
          fail-on-empty: true
          title: ATT FW Test Results - ${{ matrix.name }}

      - name: Create Report Artifact
        if: always()
        uses: actions/upload-artifact@v6
        id: artifact-report
        with:
          name: test-report-${{ matrix.artifact_name }}
          path: |
            asset-tracker-template/tests/on_target/results/*.html

      - name: Push log files to artifacts
        if: always()
        uses: actions/upload-artifact@v6
        id: artifact-upload-test-logs
        with:
          name: test-logs-${{ matrix.artifact_name }}
          path: |
            asset-tracker-template/tests/on_target/outcomes/logs/*.txt
