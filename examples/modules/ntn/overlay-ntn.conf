# Iridium NTN fallback, using a Deutsche Telekom SIM card for both the terrestrial network and NTN.
# Requires modem firmware with Iridium NTN support.
CONFIG_APP_NTN=y

CONFIG_TASK_WDT_CHANNELS=9

# Match prj.conf debug level for other modules (state machine LOG_DBG in ntn_module)
CONFIG_APP_NTN_LOG_LEVEL_DBG=y
# Modem NTN library ("ntn:" location-update lines)
CONFIG_NTN_LOG_LEVEL_DBG=y
# lte_lc CFUN/PDN/system mode (tag: lte_lc)
# CONFIG_LTE_LINK_CONTROL_LOG_LEVEL_DBG=y

# Iridium NTN is IPv4 only. TN uses the same default PDN, so the nRF Cloud CoAP socket opened
# on TN must be IPv4 to be resumable over NTN.
CONFIG_NET_IPV6=n
CONFIG_LTE_LC_PDN_LEGACY_PCO=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="internet.m2mportal.de"

# Iridium cell search and registration can take several minutes on first attach
CONFIG_APP_NTN_CONNECTION_TIMEOUT_SECONDS=600

# RRC + PDN + confirmable CoAP over NTN can exceed the default 180 s post-reg window
CONFIG_APP_NTN_REGISTERED_TIMEOUT_SECONDS=300

# High RTT on Iridium: longer CoAP ACK wait and retransmits (TN build keeps prj.conf defaults).
# Worst case per confirmable request is about 210 s, which must fit twice (shadow update and
# location) within CONFIG_APP_NTN_MSG_PROCESSING_TIMEOUT_SECONDS.
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=20000
CONFIG_COAP_MAX_RETRANSMIT=2
CONFIG_NRF_CLOUD_COAP_MAX_RETRIES=5

# PSM may conflict with Iridium NTN behavior, so it is not requested at all in NTN builds
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_PROPRIETARY_PSM_REQ=n

# The nRF Cloud CoAP session is resumed from the NTN module thread
CONFIG_COAP_CLIENT_STACK_SIZE=2048

# Without a terrestrial network there is no A-GNSS, and fixes take longer
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_TIMEOUT=180000
CONFIG_LOCATION_REQUEST_DEFAULT_TIMEOUT=240000

# GNSS only, so samples taken while disconnected produce fixes the NTN module can send
CONFIG_LOCATION_METHOD_CELLULAR=n
CONFIG_LOCATION_METHOD_WIFI=n
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_SECOND_NONE=y
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_THIRD_NONE=y

# Time comes from the network (%XTIME) and the modem clock. Avoid NTP traffic over NTN.
CONFIG_DATE_TIME_NTP=n
